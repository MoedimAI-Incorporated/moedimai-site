name: website-ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: lint · typecheck · build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.12"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=low

      - name: Development toolchain advisory report
        continue-on-error: true
        run: npm audit --include=dev --audit-level=high

      - name: Website enquiry regression tests
        run: node --experimental-strip-types --test scripts/tests/*.test.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: "https://www.moedimai.com"

      - name: Verify no server-only secrets in client bundle
        run: ./scripts/check-client-secrets.sh
